<script src="/static/deps/pdf.js"></script>

<script>
	// Spatial Audio
	let audioContext;
	let masterGain;

	// Initialize audio context on user interaction
	initAudioContext();

	function initAudioContext() {
		audioContext = new (window.AudioContext || window.webkitAudioContext)();
		masterGain = audioContext.createGain();
		masterGain.connect(audioContext.destination);
	}

	// Utility functions for audio spatialization
	function calculateDistance(node, centerX, centerY) {
		const dx = node.position.x - centerX;
		const dy = node.position.y - centerY;
		return Math.sqrt(dx * dx + dy * dy);
	}

	function calculatePanning(node, centerX, distance, maxDistance) {
		const maxPan = 0.8; // Maximum panning effect
		const relativeX = (node.position.x - centerX) / (window.innerWidth / (2 * scene.scale));
		
		// Increase this value to extend the area of minimal panning
		const panStartDistance = maxDistance * 0.5; // 50% of max distance
		
		// Calculate panning factor based on distance
		let panFactor;
		if (distance <= panStartDistance) {
			// Even more minimal panning when close
			panFactor = 0.05; // Reduced from 0.2 to 0.05
		} else {
			// More gradual increase in panning as distance increases
			panFactor = 0.05 + 0.95 * Math.pow((distance - panStartDistance) / (maxDistance - panStartDistance), 2);
		}
		
		// Apply the panning factor
		return Math.max(-maxPan, Math.min(maxPan, relativeX * panFactor));
	}

	function calculateVolume(distance, maxDistance) {
		const minVolume = 0;  // Minimum volume (never completely silent if minVolume > 0)
		const fullVolumeDistance = maxDistance * 0.4;  // Increased distance at which volume starts to decrease
		const falloffFactor = 1;  // Increase for a more gradual falloff (higher = more gradual)

		if (distance <= fullVolumeDistance) {
			// Gradual volume reduction even within fullVolumeDistance
			return 1 - (0.1 * (distance / fullVolumeDistance));
		} else {
			// More gradual fall-off beyond fullVolumeDistance
			const normalizedDistance = (distance - fullVolumeDistance) / (maxDistance - fullVolumeDistance);
			return Math.max(minVolume, 0.9 - Math.pow(normalizedDistance, falloffFactor));
		}
	}

	// Theme stuff
	let themes = [];
	let currentThemeIndex = 0;
	let isF2Pressed = false;

	function extractThemesFromCSS() {
		const styleSheets = document.styleSheets;
		for (let i = 0; i < styleSheets.length; i++) {
			const rules = styleSheets[i].cssRules || styleSheets[i].rules;
			for (let j = 0; j < rules.length; j++) {
				const rule = rules[j];
				if (rule.selectorText && rule.selectorText.startsWith(':root[data-theme=')) {
					const theme = rule.selectorText.match(/data-theme="([^"]+)"/)[1];
					themes.push(theme);
				}
			}
		}
	}

	function updateNodeStyles() {
		const highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--highlight').trim();
		const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
		const fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--font-family').trim();

		scene.children.forEach(node => {
			// node.elem.style.backgroundColor = highlightColor;
			node.content.style.color = textColor;
			node.content.style.fontFamily = fontFamily;
		});
	}

	function updateFavicon() {
		const backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--background').trim();
		const svgContent = `
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
				<rect width="100" height="100" fill="${backgroundColor}"/>
			</svg>
		`;
		const favicon = document.getElementById('favicon');
		favicon.href = `data:image/svg+xml,${encodeURIComponent(svgContent)}`;
	}

	function cycleTheme() {
		currentThemeIndex = (currentThemeIndex + 1) % themes.length;
		const newTheme = themes[currentThemeIndex];
		document.documentElement.setAttribute('data-theme', newTheme);
		updateNodeStyles();
		updateFavicon();

		// Send the new theme to the server
		ws.send(JSON.stringify({
			"type": "save_theme",
			"theme": newTheme
		}));
	}

	document.addEventListener('keydown', function(event) {
		if (event.key === 'F2' && !isF2Pressed) {
			event.preventDefault();
			isF2Pressed = true;
			cycleTheme();
		}
	});

	document.addEventListener('keyup', function(event) {
		if (event.key === 'F2') {
			isF2Pressed = false;
		}
	});

	function setInitialTheme() {
		extractThemesFromCSS();
		if (themes.length > 0) {
			document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
			updateNodeStyles();
		}
	}

	window.addEventListener('load', function() {
		setInitialTheme();
		updateFavicon();
	});
	
	pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/deps/pdf.worker.js';

	// Currently hovered text node (used to redirect pinch-zoom to font scaling)
	let hoveredTextNode = null;

	// Wheel-stream tracking: lets image nodes ignore wheel events that are
	// part of an ongoing canvas-pan stream so panning doesn't snap to image
	// pan/zoom when the cursor crosses an image.
	let lastWheelTs = 0;
	let lastWheelNode = null;
	const clamp = (x, min, max) =>
	Math.min(Math.max(x, min), max)
	
	const round = (x, n=0) => 10**(-n) * Math.round(x * 10**n);

	class Vec {
		constructor({x, y, z=0}) {
			this.x = x;
			this.y = y;
			this.z = z;
		}
		add(other) {
			return new Vec({
				x: this.x + other.x,
				y: this.y + other.y,
				z: this.z + other.z
			});
		}
		times(c) {
			return new Vec({
				x: c * this.x,
				y: c * this.y,
				z: c * this.z
			});
		}
		sub(other) {
			return this.add(other.times(-1));
		}
		dot(other) {
			return this.x * other.x
			+ this.y * other.y
			+ this.z * other.z;
		}
		mod(n) {
			return new Vec({
				x: this.x % n,
				y: this.y % n,
				z: this.z % n,
			})
		}
		abs() {
			return new Vec({
				x: Math.abs(this.x),
				y: Math.abs(this.y),
				z: Math.abs(this.z),
			})
		}
	}
	
	class Node {
		constructor({ render, data }) {
			const {
				x, y, z, w = null, h = null, creationScale, fontSize = null,
				userScale = 1, panX = 0, panY = 0,
			} = render;
			
			this.data = data;
			this.type = data.type;
			this.path = data.path;
			this.inStage = false;
			this.elem = document.createElement("div");
			this.audioSource = null;
			this.gainNode = null;
			this.panNode = null;
			
			// Depths:
			// 0: scene
			// 1: items in scene
			// 2: stage
			// 3: items in stage
			// 4: item in focus
			
			// Positioning and rendering
			this.position = new Vec({x, y});
			this.depth = z;
			this.width = w;
			this.height = h;
			this.ratio = w / h;
			this.creationScale = creationScale;
			this.padding = 8 / creationScale;
			this.fontSize = fontSize !== null ? fontSize : 26 / creationScale;
			this.borderRadius = 0;

			// Image zoom-to-crop / pan state (used by image types only)
			this.userScale = userScale;
			this.panX = panX;
			this.panY = panY;
			
			// Populate div and set ratio
			this.content = this.populateContent(data);
			this.elem.appendChild(this.content);
			
			// Interaction helpers
			this.dragging = false;
			this.click = null;
			
			this.boundMouseMove = (e) => this.mousemove(e);
			this.boundMouseUp = (e) => this.mouseup(e);
			
			this.elem.addEventListener("mousedown", (e) => {
				document.addEventListener('mousemove', this.boundMouseMove);
				document.addEventListener('mouseup', this.boundMouseUp);
				this.mousedown(e)
			});

			// Resize handles (only meaningful for resizable types; skipped for dirs)
			this.resizing = null;
			this.handles = [];
			if (this.type !== "dir") {
				this.createResizeHandles();
			}
		}

		createResizeHandles() {
			// Handles are centered on the node's edges/corners so their hitbox
			// extends equally outward (past the selection outline) and inward.
			// Corners are square; edges stretch between the corner footprints.
			const T = 24; // total thickness of edge / corner handles, in px
			const positions = [
				{ name: "nw", cursor: "nwse-resize", corner: true  },
				{ name: "ne", cursor: "nesw-resize", corner: true  },
				{ name: "se", cursor: "nwse-resize", corner: true  },
				{ name: "sw", cursor: "nesw-resize", corner: true  },
				{ name: "n",  cursor: "ns-resize",   corner: false },
				{ name: "s",  cursor: "ns-resize",   corner: false },
				{ name: "e",  cursor: "ew-resize",   corner: false },
				{ name: "w",  cursor: "ew-resize",   corner: false },
			];
			for (const p of positions) {
				const h = document.createElement("div");
				h.style.position = "absolute";
				h.style.cursor = p.cursor;
				h.style.zIndex = "10";
				h.style.display = "none";
				h.dataset.handle = p.name;
				h.dataset.corner = p.corner ? "1" : "0";

				if (p.corner) {
					h.style.width = T + "px";
					h.style.height = T + "px";
					h.style.left = (p.name.includes("w") ? `-${T / 2}px` : `calc(100% - ${T / 2}px)`);
					h.style.top  = (p.name.includes("n") ? `-${T / 2}px` : `calc(100% - ${T / 2}px)`);
				} else if (p.name === "n" || p.name === "s") {
					h.style.height = T + "px";
					h.style.left = `${T / 2}px`;
					h.style.right = `${T / 2}px`;
					h.style.top = (p.name === "n" ? `-${T / 2}px` : `calc(100% - ${T / 2}px)`);
				} else { // e or w
					h.style.width = T + "px";
					h.style.top = `${T / 2}px`;
					h.style.bottom = `${T / 2}px`;
					h.style.left = (p.name === "w" ? `-${T / 2}px` : `calc(100% - ${T / 2}px)`);
				}

				h.addEventListener("mousedown", (e) => this.resizeStart(e, p));
				this.elem.appendChild(h);
				this.handles.push(h);
			}
		}

		showHandles(show) {
			for (const h of this.handles) h.style.display = show ? "block" : "none";
		}

		resizeStart(e, handle) {
			e.preventDefault();
			e.stopPropagation();
			if (e.altKey) return;

			this.resizing = {
				handle: handle,
				startMouse: new Vec({ x: e.clientX, y: e.clientY }),
				startPos: new Vec({ x: this.position.x, y: this.position.y }),
				startW: this.width,
				startH: this.height,
				startFontSize: this.fontSize,
				startPanX: this.panX,
				startPanY: this.panY,
				ratio: (this.width && this.height) ? this.width / this.height : this.ratio,
			};

			const onMove = (ev) => this.resizeMove(ev);
			const onUp = (ev) => {
				this.resizing = null;
				document.removeEventListener("mousemove", onMove);
				document.removeEventListener("mouseup", onUp);
			};
			document.addEventListener("mousemove", onMove);
			document.addEventListener("mouseup", onUp);
		}

		resizeMove(e) {
			if (!this.resizing) return;
			e.preventDefault();

			const r = this.resizing;
			// Mouse delta in absolute (scene) coordinates
			const dxAbs = (e.clientX - r.startMouse.x) / scene.scale;
			const dyAbs = (e.clientY - r.startMouse.y) / scene.scale;

			const name = r.handle.name;
			const movesLeft = name.includes("w");
			const movesTop  = name.includes("n");
			const affectsX  = name.includes("e") || name.includes("w");
			const affectsY  = name.includes("n") || name.includes("s");

			let newW = r.startW;
			let newH = r.startH;
			let newX = r.startPos.x;
			let newY = r.startPos.y;

			if (affectsX) {
				if (movesLeft) {
					newW = r.startW - dxAbs;
					newX = r.startPos.x + dxAbs;
				} else {
					newW = r.startW + dxAbs;
				}
			}
			if (affectsY) {
				if (movesTop) {
					newH = r.startH - dyAbs;
					newY = r.startPos.y + dyAbs;
				} else {
					newH = r.startH + dyAbs;
				}
			}

			// PDF / video still keep their aspect; images now resize freely
			// because the cover-fit transform handles cropping for any box.
			const lockAspect = (
				this.type === "application/pdf" ||
				this.type === "video/mp4"
			);
			if (lockAspect && r.ratio) {
				let scale;
				if (r.handle.corner) {
					// Pick the axis the user pushed harder
					const wScale = newW / r.startW;
					const hScale = newH / r.startH;
					scale = Math.abs(wScale - 1) > Math.abs(hScale - 1) ? wScale : hScale;
				} else if (affectsX) {
					scale = newW / r.startW;
				} else {
					scale = newH / r.startH;
				}
				newW = r.startW * scale;
				newH = r.startH * scale;
				if (movesLeft) newX = r.startPos.x + (r.startW - newW);
				if (movesTop)  newY = r.startPos.y + (r.startH - newH);
			}

			// Clamp to a small minimum so we can't invert
			const minSize = 10 / scene.scale;
			if (newW < minSize) {
				if (movesLeft) newX -= (minSize - newW);
				newW = minSize;
			}
			if (newH < minSize) {
				if (movesTop) newY -= (minSize - newH);
				newH = minSize;
			}

			// Anchor the image to the opposite edge being dragged so it doesn't
			// appear to slide as the box changes size. Compute the new pan from
			// the *start* of the resize (not the previous frame) so corrections
			// don't accumulate.
			const isImage = (
				this.type === "image/jpeg" ||
				this.type === "image/png" ||
				this.type === "image/gif"
			) && this._imageEl && this._imageEl.naturalWidth;
			if (isImage) {
				const nw = this._imageEl.naturalWidth;
				const nh = this._imageEl.naturalHeight;
				const oldBoxW = r.startW * scene.scale;
				const oldBoxH = r.startH * scene.scale;
				const newBoxW = newW * scene.scale;
				const newBoxH = newH * scene.scale;
				const oldBase = Math.max((oldBoxW + 1) / nw, (oldBoxH + 1) / nh);
				const newBase = Math.max((newBoxW + 1) / nw, (newBoxH + 1) / nh);
				const oldTotal = oldBase * this.userScale;
				const newTotal = newBase * this.userScale;

				if (affectsX) {
					const halfX = oldBoxW / (2 * oldTotal) - newBoxW / (2 * newTotal);
					// dragging right edge (!movesLeft) → anchor left edge → +halfX
					// dragging left edge (movesLeft)   → anchor right edge → -halfX
					this.panX = r.startPanX + (movesLeft ? -halfX : halfX);
				}
				if (affectsY) {
					const halfY = oldBoxH / (2 * oldTotal) - newBoxH / (2 * newTotal);
					this.panY = r.startPanY + (movesTop ? -halfY : halfY);
				}
			}

			this.width = newW;
			this.height = newH;
			this.position = new Vec({ x: newX, y: newY });
			if (isImage) this.clampImagePan();
			this.render();
		}

		applyImageStageMode() {
			if (!this._imageEl) return;
			const wrap = this._imageWrap;
			const img = this._imageEl;
			wrap.style.position = "static";
			wrap.style.width = "120px";
			wrap.style.height = "auto";
			wrap.style.overflow = "visible";
			img.style.position = "static";
			img.style.top = "";
			img.style.left = "";
			img.style.transform = "";
			img.style.width = "100%";
			img.style.height = "auto";
			img.style.pointerEvents = "auto";
		}

		applyImageSceneMode() {
			if (!this._imageEl) return;
			const wrap = this._imageWrap;
			const img = this._imageEl;
			wrap.style.position = "relative";
			wrap.style.width = "100%";
			wrap.style.height = "100%";
			wrap.style.overflow = "hidden";
			img.style.position = "absolute";
			img.style.top = "50%";
			img.style.left = "50%";
			img.style.width = "";
			img.style.height = "";
			img.style.pointerEvents = "none";
			this.render();
		}

		// memori-style zoom-to-crop and pan, scoped to the hovered image only
		bindImageZoomPan(target) {
			target.addEventListener("wheel", (e) => {
				if (this.inStage) return;
				if (!this._imageEl || !this._imageEl.naturalWidth) return;

				const now = performance.now();
				// If the user is mid-stream panning the canvas (rapid wheel
				// events not on this node), don't suddenly hijack just because
				// the cursor crossed an image. Pinch (ctrlKey) is intentional
				// and should always route to the image.
				if (!e.ctrlKey) {
					const sinceLast = now - lastWheelTs;
					const sameTarget = lastWheelNode === this;
					if (sinceLast < 120 && !sameTarget) {
						lastWheelTs = now;
						return; // let it bubble to scene
					}
				}
				lastWheelTs = now;
				lastWheelNode = this;

				e.preventDefault();
				e.stopPropagation();

				const boxW = this.width * scene.scale;
				const boxH = this.height * scene.scale;
				const baseScale = this._baseScale || Math.max(
					boxW / this._imageEl.naturalWidth,
					boxH / this._imageEl.naturalHeight
				);

				if (e.ctrlKey) {
					// Pinch zoom centered on the cursor
					const rect = target.getBoundingClientRect();
					const cursorX = e.clientX - rect.left - rect.width / 2;
					const cursorY = e.clientY - rect.top - rect.height / 2;

					const oldUserScale = this.userScale;
					const oldTotal = baseScale * oldUserScale;
					const newUserScale = clamp(
						oldUserScale * Math.exp(-0.01 * e.deltaY), 1, 10
					);
					const newTotal = baseScale * newUserScale;
					// Keep the image point under the cursor stationary
					const scaleDiff = 1 / newTotal - 1 / oldTotal;
					this.panX += cursorX * scaleDiff;
					this.panY += cursorY * scaleDiff;
					this.userScale = newUserScale;
				} else {
					// Two-finger scroll: pan the image inside its frame
					const total = baseScale * this.userScale;
					this.panX -= e.deltaX / total;
					this.panY -= e.deltaY / total;
				}

				this.clampImagePan();
				this.render();
			}, { passive: false });
		}

		clampImagePan() {
			if (!this._imageEl || !this._imageEl.naturalWidth) return;
			const nw = this._imageEl.naturalWidth;
			const nh = this._imageEl.naturalHeight;
			const boxW = this.width * scene.scale;
			const boxH = this.height * scene.scale;
			const totalScale = (this._baseScale || Math.max(boxW / nw, boxH / nh)) * this.userScale;
			// Pan is in natural-image pixels. Overhang past the box, in natural-
			// image pixels, is (nw - boxW / totalScale) on the x axis (and y).
			const maxX = Math.max(0, (nw - boxW / totalScale) / 2);
			const maxY = Math.max(0, (nh - boxH / totalScale) / 2);
			this.panX = clamp(this.panX, -maxX, maxX);
			this.panY = clamp(this.panY, -maxY, maxY);
		}

		serialize() {
			let render = {
				x: this.position.x,
				y: this.position.y,
				z: this.depth,
				h: this.height,
				w: this.width,
				creationScale: this.creationScale,
				fontSize: this.fontSize,
				userScale: this.userScale,
				panX: this.panX,
				panY: this.panY,
			}
			for (const key of Object.keys(render)) {
				render[key] = round(render[key], 2);
			}
			return {
				data: this.data,
				render: render,
			}
		}
		
		render() {
			// PDF / video still need to keep their aspect (no cover-fit yet).
			const ratioLocked = (
				this.type === "application/pdf" ||
				this.type === "video/mp4"
			);
			if (ratioLocked && this.ratio && this.width) {
				this.height = this.width / this.ratio;
			}

			if (!this.inStage) {
				const pos = scene.toViewport(this.position);
				this.elem.style.left = pos.x + "px";
				this.elem.style.top = pos.y + "px";
				this.elem.style.zIndex = Math.min(this.depth, this.maxDepth);
				this.elem.style.width = (this.width * scene.scale) + "px";
				this.elem.style.height = (this.height * scene.scale) + "px";
			}
			this.elem.style.borderRadius = (this.borderRadius * scene.scale) + "px";
			//this.elem.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--highlight').trim();

			// memori-style image rendering: cover the box without distortion,
			// then apply user zoom and pan on top. A tiny epsilon avoids
			// sub-pixel slack at the box edges from CSS rounding. Skip for
			// stage nodes; they use simple natural-size sizing.
			if (!this.inStage && this._imageEl && this._imageEl.naturalWidth) {
				const boxW = this.width * scene.scale;
				const boxH = this.height * scene.scale;
				const nw = this._imageEl.naturalWidth;
				const nh = this._imageEl.naturalHeight;
				const baseScale = Math.max((boxW + 1) / nw, (boxH + 1) / nh);
				const totalScale = baseScale * this.userScale;
				this._baseScale = baseScale;
				this._imageEl.style.transform =
					`translate(-50%, -50%) scale(${totalScale}) translate(${this.panX}px, ${this.panY}px)`;
			}
			
			this.content.style.fontSize = Math.floor(this.fontSize * scene.scale) + "px";
			// Images keep square clipping and no padding regardless of zoom
			// so their edges stay sharp at the inner image bounds.
			const isImage = (
				this.type === "image/jpeg" ||
				this.type === "image/png" ||
				this.type === "image/gif"
			);
			if (!isImage) {
				this.content.style.padding = (this.padding * scene.scale) + "px";
				this.content.style.borderRadius = (this.borderRadius * scene.scale) + "px";
			}
			this.content.style.color = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
			this.content.style.fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--font-family').trim();
			const highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--highlight').trim();
			const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
			const fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--font-family').trim();

			// this.elem.style.backgroundColor = highlightColor;
			this.content.style.color = textColor;
			this.content.style.fontFamily = fontFamily;
		}

		setAutoplay() {
			if (this.type === "audio/mpeg" && !this.inStage) {
				const audio = this.content.querySelector('audio');
				if (audio) {
					audio.loop = true;
					this.elem.setAttribute('data-autoplay', 'true');
				}
			}
		}

		triggerAutoplay() {
			if (this.type === "audio/mpeg" && !this.inStage) {
				const audio = this.content.querySelector('audio');
				if (audio && this.elem.getAttribute('data-autoplay') === 'true') {
					audio.autoplay = true;
					audio.play().catch(e => console.log("Autoplay prevented:", e));
				}
			}
		}

		setupAudioNodes() {
			if (this.type === "audio/mpeg" && !this.audioSource && audioContext) {
				const audio = this.content.querySelector('audio');
				if (audio) {
					this.audioSource = audioContext.createMediaElementSource(audio);
					this.gainNode = audioContext.createGain();
					this.panNode = audioContext.createStereoPanner();
					
					this.audioSource.connect(this.gainNode);
					this.gainNode.connect(this.panNode);
					this.panNode.connect(masterGain);
				}
			}
		}

		updateAudioSpatialization() {
			if (this.gainNode && this.panNode) {
				const centerX = scene.origin.x + window.innerWidth / (2 * scene.scale);
				const centerY = scene.origin.y + window.innerHeight / (2 * scene.scale);
				
				const distance = calculateDistance(this, centerX, centerY);
				const maxDistance = Math.sqrt(window.innerWidth * window.innerWidth + window.innerHeight * window.innerHeight) / (2 * scene.scale);
				
				// Volume calculation
				const volume = calculateVolume(distance, maxDistance);
				this.gainNode.gain.setTargetAtTime(volume, audioContext.currentTime, 0.1);
				
				// Panning calculation
				const panning = calculatePanning(this, centerX, distance, maxDistance);
				this.panNode.pan.setTargetAtTime(panning, audioContext.currentTime, 0.1);
			}
		}
		
		populateContent(data) {
			let {type, path} = data;
			
			if (type === "image/jpeg" || type === "image/png" || type === "image/gif") {
				// Two display modes: stage (natural shape, simple) and scene
				// (clipping wrap + absolutely-centered img with cover transform).
				// Initial styles are neutral; applyImageStageMode / applyImageSceneMode
				// switch them when the node is added to one or the other.
				const wrap = document.createElement("div");
				// Square clipping so image edges stay sharp during pan/zoom
				// regardless of the elem's rounded corners.
				wrap.style.borderRadius = "0";

				const img = document.createElement("img");
				img.style.display = "block";
				img.style.pointerEvents = "none";
				img.style.transformOrigin = "center center";
				img.draggable = false;
				img.onload = () => {
					this.ratio = img.naturalWidth / img.naturalHeight;
					this.render();
				};
				img.src = path;
				wrap.appendChild(img);
				this._imageEl = img;
				this._imageWrap = wrap;

				this.bindImageZoomPan(wrap);

				return wrap;
				
			} else if (type === "audio/mpeg") {
				const audioContainer = document.createElement("div");
				audioContainer.style.display = "flex";
				audioContainer.style.flexDirection = "column";
				audioContainer.style.justifyContent = "center";

				const audio = document.createElement("audio");
				audio.style.width = "100%";
				audio.preload = "auto";
				audio.controls = true;
				audio.src = path;

				const label = document.createElement("div");
				label.textContent = path.split('/').pop(); // Display filename
				label.style.textAlign = "center";
				label.style.padding = "5px";
				label.style.overflow = "hidden";
				label.style.textOverflow = "ellipsis";
				label.style.whiteSpace = "nowrap";
				label.style.fontSize = "0.8em";

				audioContainer.appendChild(audio);
				audioContainer.appendChild(label);

				this.ratio = 3;
				return audioContainer;
				
			} else if (type === "video/mp4") {
				const videoContainer = document.createElement("div");
				videoContainer.style.display = "flex";
				videoContainer.style.flexDirection = "column";
				videoContainer.style.justifyContent = "center";

				const video = document.createElement("video");
				video.style.width = "100%";
				video.preload = "auto";
				video.controls = true;
				video.src = path;
				
				// Only stop propagation for video controls when playing
				video.addEventListener("mousedown", e => {
					// Allow mousedown to propagate when trying to delete (alt key)
					// or when video is paused (so user can drag it)
					if (!e.altKey && !video.paused) {
						e.stopPropagation();
					}
				});

				const label = document.createElement("div");
				label.textContent = path.split('/').pop(); // Display filename
				label.style.textAlign = "center";
				label.style.padding = "5px";
				label.style.overflow = "hidden";
				label.style.textOverflow = "ellipsis";
				label.style.whiteSpace = "nowrap";
				label.style.fontSize = "0.8em";

				videoContainer.appendChild(video);
				videoContainer.appendChild(label);

				this.ratio = 16/9; // Default aspect ratio for videos
				return videoContainer;
				
			} else if (type === "application/pdf") {
				const canvas = document.createElement("canvas");
				const ctx = canvas.getContext("2d");
				
				canvas.style.width = "100%";
				
				(async () => {
					const pdf = await pdfjsLib.getDocument(path).promise;
					
					const renderPage = async (n) => {
						const page = await pdf.getPage(n);
						
						const scale = 1000 / page.getViewport({scale: 1}).width;
						const viewport = page.getViewport({scale});
						canvas.height = viewport.height;
						canvas.width = viewport.width;
						
						await page.render({
							canvasContext: ctx,
							viewport: viewport
						});
					}
					
					// Hack: when we first create a PDF, i.e. in stage, page is not defined
					// yet so we render some buttons for page selection.  When we clone to
					// add to the stage, the property is set, so the buttons dissappear.
					
					if (this.data.page === undefined) {
						this.data.page = 1;
						
						const center = document.createElement("center");
						center.style.marginTop = "5px";
						
						const pageLabel = document.createElement("span");
						pageLabel.style.padding = "10px";
						pageLabel.innerHTML = this.data.page;
						
						const previous = document.createElement("button");
						previous.style.border = "solid 1px darkgrey";
						previous.style.outline = "none";
						previous.style.borderRadius = "5px";
						previous.style.backgroundColor = "#eee8e7";
						previous.style.height = "20px";
						previous.style.width = "30px";
						
						previous.innerHTML = "<";
						previous.addEventListener("mousedown", e => {
							e.stopPropagation();
							this.data.page = this.data.page - 1;
							if (this.data.page < 1) {
								this.data.page = pdf.numPages;
							}
							pageLabel.innerHTML = this.data.page;
							renderPage(this.data.page);
						});
						
						const next = document.createElement("button");
						next.style.border = "solid 1px darkgrey";
						next.style.outline = "none";
						next.style.borderRadius = "5px";
						next.style.backgroundColor = "#eee8e7";
						next.style.height = "20px";
						next.style.width = "30px";
						
						next.innerHTML = ">";
						next.addEventListener("mousedown", e => {
							e.stopPropagation();
							this.data.page = this.data.page + 1;
							if (this.data.page > pdf.numPages) {
								this.data.page = 1;
							}
							pageLabel.innerHTML = this.data.page;
							renderPage(this.data.page);
						});
						
						center.appendChild(previous);
						center.appendChild(pageLabel);
						center.appendChild(next);
						this.elem.appendChild(center);
					}
					
					renderPage(this.data.page);
				})()
				
				this.ratio = 1 / 1.29;
				this.height = this.width / this.ratio;
				return canvas;
				
			} else if (type === "text") {
				const p = document.createElement("p");
				p.innerHTML = path || "";
				p.classList.add("textNode");
				this.ratio = 5;

				// Make the <p> fill the node box so the visible bounds match the
				// elem (which is what resize handles position against).
				p.style.width = "100%";
				p.style.height = "100%";
				p.style.boxSizing = "border-box";
				p.style.overflowX = "hidden";
				p.style.overflowY = "auto";
				p.style.margin = "0";

				// Track hover so pinch gestures can target this node's font size
				this.elem.addEventListener("mouseenter", () => { hoveredTextNode = this; });
				this.elem.addEventListener("mouseleave", () => {
					if (hoveredTextNode === this) hoveredTextNode = null;
				});

				// Scroll the text content on wheel when there's Y overflow,
				// instead of letting the scene pan/zoom take the event. Honor
				// the wheel-stream throttle so the cursor crossing a text node
				// mid-pan doesn't hijack scrolling.
				p.addEventListener("wheel", (e) => {
					if (this.inStage) return;
					if (e.ctrlKey) return; // pinch → font scale, handled at scene
					const overflows = p.scrollHeight > p.clientHeight + 1;
					if (!overflows) return;

					const now = performance.now();
					const sinceLast = now - lastWheelTs;
					const sameTarget = lastWheelNode === this;
					if (sinceLast < 120 && !sameTarget) {
						lastWheelTs = now;
						return; // let it bubble to scene
					}
					lastWheelTs = now;
					lastWheelNode = this;

					e.preventDefault();
					e.stopPropagation();
					p.scrollTop += e.deltaY;
				}, { passive: false });

				p.contentEditable = "true";
				p.spellcheck = false;

				// Prevent parent mousedown when editing text (not dragging)
				p.addEventListener("mousedown", (e) => {
					// Check if the text node is being dragged vs. edited
					const isEditMode = document.activeElement === p;
					
					if (isEditMode) {
						// We're already focused and editing text - prevent dragging behavior
						e.stopPropagation();
					}
					// Otherwise, don't stop propagation so the node can be dragged
				});
				
				// Handle clicks to place cursor within text
				p.addEventListener("click", (e) => {
					// Always stop propagation for clicks inside text nodes
					e.stopPropagation();
					
					// Focus the text node if not already focused
					if (document.activeElement !== p) {
						p.focus();
						
						// Initial activation - place cursor at the end
						const range = document.createRange();
						range.selectNodeContents(p);
						range.collapse(false); // Collapse to end
						const selection = window.getSelection();
						selection.removeAllRanges();
						selection.addRange(range);
					}
					// If already focused, the browser's default click behavior will position the cursor
				});
				// Clear any text selection when losing focus
				p.addEventListener("blur", () => {
					if (p.innerHTML.trim() === "") {
						p.innerHTML = "";
					}
					this.data.path = p.innerHTML;
					
					// Clear any text selection when the node loses focus
					window.getSelection().removeAllRanges();
				});
				
				// Update cursor style based on active state
				p.addEventListener("mouseover", () => {
					// Show text cursor when node is active/focused
					if (document.activeElement === p) {
						p.style.cursor = "text";
					} else {
						p.style.cursor = "grab";
					}
				});
				
				// Make sure cursor style updates immediately when focus changes
				p.addEventListener("focus", () => {
					p.style.cursor = "text";
				});
				
				// Reset cursor when mouse leaves the element
				p.addEventListener("mouseout", () => {
					if (document.activeElement !== p) {
						p.style.cursor = ""; // Reset to default when not hovering
					}
				});
				p.onkeyup = (e) => {
					this.data.path = p.innerHTML;
				}
				// Auto-grow the box vertically as the user types so content
				// doesn't disappear behind a scrollbar. Manual resize still wins
				// (the box won't shrink on its own; the user can resize down to
				// force scrolling).
				p.addEventListener("input", () => {
					this.data.path = p.innerHTML;
					// Some browsers scroll the document to keep the contenteditable
					// caret in view; we manage view ourselves via the scene origin,
					// so undo any such shift.
					document.documentElement.scrollTop = 0;
					document.documentElement.scrollLeft = 0;
					document.body.scrollTop = 0;
					document.body.scrollLeft = 0;
					if (this.inStage) return;
					const needed = p.scrollHeight / scene.scale;
					if (needed > this.height) {
						this.height = needed;
						this.render();
					}
				});
				return p;
			} else if (type === "dir") {
				const p = document.createElement("p");
				p.innerHTML = path;
				p.classList.add("dirNode");
				this.ratio = 10.0;
				
				p.ondblclick = (e) => {
					e.preventDefault();
					e.stopPropagation();
					ws.send(JSON.stringify({
						"type": "cd",
						"path": data.absolute,
					}));
				}
				
				return p
			}
		}
		
		getViewportPosition() {
			return new Vec({
				x: parseInt(this.elem.style.left.slice(0, -2)),
				y: parseInt(this.elem.style.top.slice(0, -2)),
			})
		}
		
		setViewportPosition(v) {
			this.elem.style.left = v.x;
			this.elem.style.top = v.y;
			this.position = scene.toAbsolute(v);
		}
		
		moveInViewport(delta) {
			const pos = this.getViewportPosition();
			this.setViewportPosition(pos.add(delta));
		}
		
		mousedown(e) {
			e.preventDefault();
			e.stopPropagation();

			if (e.altKey) {
				scene.removeNode(this);
				return;
			}

			this.dragging = true;
			this.click = new Vec({x: e.clientX, y: e.clientY});
			document.body.classList.add("grabbing");

			if (this.inStage) {
				// Position on scene
				const rect = this.elem.getBoundingClientRect();
				const pos = new Vec({
					x: e.clientX - rect.left,
					y: e.clientY - rect.top,
				})

				// Create a new copy
				const sizes = this.ratio > 1 ? {
					w: 200 / scene.scale,
					h: 200 / scene.scale / this.ratio,
				} : {
					w: this.ratio * 200 / scene.scale,
					h: (200 / scene.scale),
				};

				const copy = new this.constructor({
					render: {
						x: null,
						y: null,
						z: 4,
						...sizes,
						creationScale: scene.scale,
					},
					data: this.data,
				});
				copy.position = scene.toAbsolute(this.click.sub(pos));
				scene.addNode(copy);

				// Continue moving the copy
				const mouseEvent = new MouseEvent('mousedown', {
					clientX: e.clientX,
					clientY: e.clientY,
					bubbles: true,
					cancelable: true,
					altKey: false // Ensure alt key isn't passed to avoid deletion
				});
				
				// For video and audio elements, add a safety mechanism
				if (this.data.type === "video/mp4" || this.data.type === "audio/mpeg") {
					// Global handler that will clear selection on mouseup
					const globalMouseUp = () => {
						copy.dragging = false;
						window.getSelection().empty();
						document.removeEventListener('mouseup', globalMouseUp);
					};
					document.addEventListener('mouseup', globalMouseUp, { once: true });
				}
				
				copy.elem.dispatchEvent(mouseEvent);
				this.dragging = false;

			} else {
				if (e.shiftKey) {
					scene.removeNode(this);
					this.elem.remove();
				} else {
					// Check if we're clicking on a selected node
					const isNodeInSelection = scene.selectedNodes.includes(this);
					
					// If not a selected node and not adding to selection with ctrl/cmd,
					// clear the current selection
					if (!isNodeInSelection && !e.ctrlKey && !e.metaKey) {
						scene.clearSelection();
					}
					
					// If ctrl/cmd key is pressed, toggle this node's selection
					if (e.ctrlKey || e.metaKey) {
						if (isNodeInSelection) {
							// Remove from selection
							const index = scene.selectedNodes.indexOf(this);
							if (index > -1) {
								// Remove outline from this specific node
								if (this.content) {
									this.content.style.outline = '';
									this.content.style.outlineOffset = '';
									console.log('Removed outline on deselect:', this.content);
								}
								scene.selectedNodes.splice(index, 1);
							}
						} else {
							// Add to selection
							scene.selectNode(this);
						}
					} else if (!isNodeInSelection) {
						// Add to selection if not already selected
						scene.selectNode(this);
					}
					
					this.depth = 4;
					this.render();
				}
			}
		}
		
		mousemove(e) {
			if (this.dragging) {
				// Prevent text selection during drag
				e.preventDefault();
				
				const click = new Vec({x: e.clientX, y: e.clientY});
				const delta = click.sub(this.click);
				
				// If this node is part of a selection, move all selected nodes
				if (scene.selectedNodes.includes(this) && scene.selectedNodes.length > 1) {
					scene.moveSelectedNodes(delta);
				} else {
					this.moveInViewport(delta);
				}
				
				this.click = click;
				
				// Ensure no text gets selected during dragging
				if (window.getSelection) {
					if (window.getSelection().empty) {  // Chrome
						window.getSelection().empty();
					} else if (window.getSelection().removeAllRanges) {  // Firefox
						window.getSelection().removeAllRanges();
					}
				}
			}
		}
		
		mouseup(e) {
			if (this.dragging) {
				this.dragging = false;
				this.render();
				this.depth = 1;
			}
			document.body.classList.remove("grabbing");
			document.removeEventListener('mousemove', this.boundMouseMove);
			document.removeEventListener('mouseup', this.boundMouseUp);
		}
	}
	
	class Scene {
		constructor(elem) {
			this.elem = elem;
			this.origin = new Vec({x: 0, y: 0});
			this.scale = 1;
			this.children = [];
			this.selectedNodes = [];
			
			// Box selection variables
			this.isSelecting = false;
			this.selectionStart = null;
			this.selectionBox = null;
			this.justFinishedBoxSelection = false;
			
			this.elem.addEventListener("wheel", (e) => this.wheel(e));
			this.elem.addEventListener("gesturestart", (e) => e.preventDefault());
			this.elem.addEventListener("gesturechange", (e) => this.gesturechange(e));
			this.elem.addEventListener("gestureend", (e) => e.preventDefault());
			this.elem.addEventListener("mousedown", (e) => this.mousedown(e));
			this.elem.addEventListener("mousemove", (e) => this.mousemove(e));
			this.elem.addEventListener("mouseup", (e) => this.mouseup(e));
			this.elem.addEventListener("dblclick", (e) => this.dblclick(e));
			this.elem.addEventListener("click", (e) => {
				if (e.target === this.elem) {
					document.activeElement.blur();
					
					// Only clear selection if we didn't just finish a box selection
					if (!this.justFinishedBoxSelection) {
						console.log('Clearing selection on canvas click');
						this.clearSelection();
					}
				}
			});
		}
		
		serialize() {
			return {
				x: round(this.origin.x, 2),
				y: round(this.origin.y, 2),
				scale: round(this.scale, 2),
				children: this.children.map(c => c.serialize()),
			}
		}
		
		toViewport(x) {
			return x.sub(this.origin).times(this.scale);
		}
		
		toAbsolute(x) {
			return x.times(1/this.scale).add(this.origin);
		}
		
		addNode(node) {
			node.elem.classList.add("nodeInScene");
			this.elem.appendChild(node.elem);
			this.children.push(node);
			if (node.applyImageSceneMode) node.applyImageSceneMode();
			node.render();
			node.setAutoplay();
			node.setupAudioNodes();
			node.updateAudioSpatialization();
			if (node.showHandles) node.showHandles(true);
		}
		
		removeNode(node) {
			node.elem.classList.remove("nodeInScene");
			this.elem.removeChild(node.elem);
			const idx = this.children.indexOf(node);
			this.children.splice(idx, 1);
		}

		updateBackgroundGrid() {
			const gridSize = 100 * this.scale;
			const offsetX = -this.origin.x * this.scale % gridSize;
			const offsetY = -this.origin.y * this.scale % gridSize;
			
			this.elem.style.backgroundSize = `${gridSize}px ${gridSize}px`;
			this.elem.style.backgroundPosition = `${offsetX}px ${offsetY}px`;
		}
		
		render() {
			this.updateBackgroundGrid();
			this.children.forEach(c => {
				c.render();
				c.setupAudioNodes();
				c.updateAudioSpatialization();
			});
		}
		
		wheel(e) {
			e.preventDefault();
			lastWheelTs = performance.now();
			lastWheelNode = null;

			if (e.ctrlKey) {
				// Pinch on a text node: scale its font, not the canvas
				if (hoveredTextNode) {
					const factor = Math.exp(-0.01 * e.deltaY);
					hoveredTextNode.fontSize = clamp(hoveredTextNode.fontSize * factor, 1, 10000);
					hoveredTextNode.render();
					return;
				}

				const pointer = new Vec({x: e.clientX, y: e.clientY});
				const a = this.toAbsolute(pointer);

				this.scale = clamp(this.scale - 0.01 * e.deltaY, 0.1, 3.0);
				
				// Re-position so mouse remains where it was
				const b = this.toAbsolute(pointer);
				const delta = b.sub(a);
				this.origin = this.origin.sub(delta);
				this.render();
				
			} else {
				const delta = new Vec({x: e.deltaX, y: e.deltaY}).times(1 / this.scale);
				this.origin = this.origin.add(delta);
				this.render();
			}
			
			const {width, height} = this.elem.getBoundingClientRect();
			for (const child of this.children) {
				child.depth = 1;
				child.render();
			}
			this.render();
		}
		
		gesturechange(e) {
			e.preventDefault();

			// Pinch on a text node: scale its font, not the canvas
			if (hoveredTextNode) {
				const factor = 1 + 0.2 * (e.scale - 1);
				hoveredTextNode.fontSize = clamp(hoveredTextNode.fontSize * factor, 1, 10000);
				hoveredTextNode.render();
				return;
			}

			const pointer = new Vec({x: e.clientX, y: e.clientY});
			const a = this.toAbsolute(pointer);

			// Resize the canvas
			const factor = 1 + 0.2 * (e.scale - 1);
			this.scale = clamp(this.scale * factor, 0.1, 3.0);
			
			// Re-position so mouse remains where it was
			const b = this.toAbsolute(pointer);
			const delta = b.sub(a);
			this.origin = this.origin.sub(delta);
			this.render();
		}
		
		mousedown(e) {
			// Only handle mousedown on the scene element itself, not on nodes
			if (e.target !== this.elem) return;
			e.preventDefault();
			
			// Clear selection when clicking empty space, unless adding to selection with ctrl/cmd
			if (!e.ctrlKey && !e.metaKey) {
				this.clearSelection();
			}
			
			// Start box selection
			this.isSelecting = true;
			this.selectionStart = new Vec({x: e.clientX, y: e.clientY});
			
			// Create the selection box element if it doesn't exist
			if (!this.selectionBox) {
				this.selectionBox = document.createElement('div');
				this.selectionBox.style.position = 'absolute';
				const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
				this.selectionBox.style.border = `3px solid ${accentColor}`;
				this.selectionBox.style.backgroundColor = accentColor;
				this.selectionBox.style.opacity = '0.15';
				this.selectionBox.id = 'selection-box';
				this.selectionBox.style.pointerEvents = 'none'; // Don't capture mouse events
				this.selectionBox.style.zIndex = '999';
				this.elem.appendChild(this.selectionBox);
			}
			
			// Initial position and size
			this.selectionBox.style.left = `${e.clientX}px`;
			this.selectionBox.style.top = `${e.clientY}px`;
			this.selectionBox.style.width = '0px';
			this.selectionBox.style.height = '0px';
			this.selectionBox.style.display = 'block';
		}
		
		mousemove(e) {
			e.preventDefault();
			
			if (this.isSelecting && this.selectionStart) {
				const currentPos = new Vec({x: e.clientX, y: e.clientY});
				const startPos = this.selectionStart;
				
				// Calculate box dimensions
				const left = Math.min(startPos.x, currentPos.x);
				const top = Math.min(startPos.y, currentPos.y);
				const width = Math.abs(currentPos.x - startPos.x);
				const height = Math.abs(currentPos.y - startPos.y);
				
				// Update selection box style
				this.selectionBox.style.left = `${left}px`;
				this.selectionBox.style.top = `${top}px`;
				this.selectionBox.style.width = `${width}px`;
				this.selectionBox.style.height = `${height}px`;
				
				// Log for debugging
				console.log('Updating selection box:', { left, top, width, height });
			}
		}
		
		mouseup(e) {
			e.preventDefault();
			
			if (this.isSelecting && this.selectionBox) {
				// Flag to prevent click event from clearing the selection
				this.justFinishedBoxSelection = true;
				
				// Get box dimensions
				const rect = this.selectionBox.getBoundingClientRect();
				const hasMinimumSize = rect.width > 5 && rect.height > 5;
				
				// Only process selection if the box has a minimum size
				if (hasMinimumSize) {
					// Clear previous selection only if not adding to selection with ctrl/cmd
					if (!e.ctrlKey && !e.metaKey) {
						this.clearSelection();
					}
					
					// Find nodes that are inside the selection box
					console.log('Selection box rect:', rect);
					let selectedAny = false;
					
					this.children.forEach(node => {
					// Get the nodeInScene element's bounding box
					const nodeRect = node.elem.getBoundingClientRect();
					console.log('Node rect:', nodeRect, 'for node:', node);
					
					// If the node is not visible, skip it
					if (!nodeRect.width || !nodeRect.height) {
						console.log('Skipping invisible node:', node);
						return;
					}
					
					// Check for overlap - a node is selected if there's any overlap with the selection box
					const isOverlapping = !(
						nodeRect.right < rect.left ||
						nodeRect.left > rect.right ||
						nodeRect.bottom < rect.top ||
						nodeRect.top > rect.bottom
					);
					
					if (isOverlapping) {
						console.log('Node selected by box:', node);
						this.selectNode(node);
						selectedAny = true;
					}
				});
					
					console.log('Box selection complete, selected nodes:', selectedAny ? this.selectedNodes.length : 0);
				}
				
				// Reset selection state
				this.selectionBox.style.display = 'none';
				this.isSelecting = false;
				this.selectionStart = null;
				
				// Clear the flag after a short delay to handle the click event
				setTimeout(() => {
					this.justFinishedBoxSelection = false;
				}, 100);
			}
		}
		
		selectNode(node) {
			if (!this.selectedNodes.includes(node)) {
				this.selectedNodes.push(node);
				
				// Add selection border to the first child element within the nodeInScene div
				const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
				
				// The actual content element is node.content (the first child)
				if (node.content) {
					// Use outline instead of border to avoid shifting content
					node.content.style.outline = `1px solid ${accentColor}`;
					node.content.style.outlineOffset = '0px';
					console.log('Applied outline to node content:', node.content);
				} else {
					console.log('No content element found for node:', node);
				}
			}
		}
		
		clearSelection() {
			// Remove selection styling from all nodes
			this.selectedNodes.forEach(node => {
				// Clear outline from the content element
				if (node.content) {
					node.content.style.outline = '';
					node.content.style.outlineOffset = '';
					console.log('Removed outline from node content:', node.content);
				}
			});
			this.selectedNodes = [];
		}
		
		moveSelectedNodes(delta) {
			// Move all selected nodes by the same delta
			this.selectedNodes.forEach(node => {
				node.moveInViewport(delta);
			});
		}
		
		dblclick(e) {
			if (e.target !== this.elem) return;

			const click = new Vec({x: e.clientX - 10, y: e.clientY - 10});
			const pos = scene.toAbsolute(click);
			
			const node = new Node({
				data: {
					type: "text",
					path: ""
				},
				render: {
					x: pos.x,
					y: pos.y,
					// Small starting width; height will auto-grow as the user types.
					w: 400 / scene.scale,
					h: 42 / scene.scale,
					z: 4,
					creationScale: scene.scale,
				},
			});
			scene.addNode(node);
			// Snap height to whatever the empty <p> actually needs after layout
			requestAnimationFrame(() => {
				const needed = node.content.scrollHeight / scene.scale;
				if (needed > 0) {
					node.height = needed;
					node.render();
				}
			});
			
			// Focus and make the new node editable
			setTimeout(() => {
				node.content.focus();
				const range = document.createRange();
				range.selectNodeContents(node.content);
				range.collapse(false);
				const selection = window.getSelection();
				selection.removeAllRanges();
				selection.addRange(range);
			}, 0);
		}
	}
	
	class Stage {
		constructor(elem) {
			this.elem = elem;
			this.children = [];
		}
		
		addNode(node) {
			node.inStage = true;
			node.elem.classList.add("nodeInStage");
			this.elem.appendChild(node.elem);
			this.children.push(node);
			if (node.showHandles) node.showHandles(false);
			if (node.applyImageStageMode) node.applyImageStageMode();
		}

		removeNode(node) {
			node.inStage = false;
			node.elem.classList.remove("nodeInStage");
			this.elem.removeChild(node.elem);
			const idx = this.children.indexOf(node);
			this.children.splice(idx, 1);
		}
		
		inStage(v) {
			const bbox = this.elem.getBoundingClientRect();
			return (
			bbox.left < v.x &&
			v.x < bbox.right &&
			bbox.top < v.y &&
			v.y < bbox.bottom
			);
		}
	}
	
	const scene = new Scene(document.getElementById("scene"));
	const stage = new Stage(document.getElementById("stage"));
	
	const resetCanvas = () => {
		for (const child of scene.children) {
			scene.elem.removeChild(child.elem);
			scene.children = [];
		}
		for (const child of stage.children) {
			stage.elem.removeChild(child.elem);
			stage.children = [];
		}
		const title = document.getElementById("path");
		if (title) title.remove();
		
		const audio = document.getElementById("audio");
		if (audio) audio.remove();
	}
	
	let lastSavedLayout = null;
	
	// Create notification container for connection alerts
	const createNotificationSystem = () => {
		const container = document.createElement('div');
		container.id = 'notification-container';
		container.style.position = 'fixed';
		container.style.top = '20px';
		container.style.left = '50%';
		container.style.transform = 'translateX(-50%)';
		container.style.zIndex = '9999';
		container.style.display = 'none';
		document.body.appendChild(container);
		
		return {
			show: (message, isError = false) => {
				container.innerHTML = '';
				container.style.display = 'block';
				
				const notification = document.createElement('div');
				notification.style.padding = '12px 20px';
				notification.style.borderRadius = '5px';
				notification.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
				notification.style.fontSize = '14px';
				notification.style.maxWidth = '400px';
				notification.style.textAlign = 'center';
				
				// Use theme colors
				const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
				const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
				const backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--highlight').trim();
				
				notification.style.backgroundColor = isError ? accentColor : backgroundColor;
				notification.style.color = textColor;
				notification.innerText = message;
				
				// Add close button
				const closeBtn = document.createElement('span');
				closeBtn.innerHTML = '&times;';
				closeBtn.style.marginLeft = '10px';
				closeBtn.style.cursor = 'pointer';
				closeBtn.style.fontWeight = 'bold';
				closeBtn.onclick = () => {
					container.style.display = 'none';
				};
				notification.appendChild(closeBtn);
				
				container.appendChild(notification);
				
				// Auto-hide after 10 seconds unless it's an error
				if (!isError) {
					setTimeout(() => {
						container.style.display = 'none';
					}, 10000);
				}
			},
			hide: () => {
				container.style.display = 'none';
			}
		};
	};

	const notification = createNotificationSystem();

	// Create WebSocket connection with reconnection functionality
	let ws = new WebSocket("ws://localhost:1234/ws");
	let reconnectAttempts = 0;
	let reconnectInterval = null;

	// Function to attempt reconnection
	const attemptReconnect = () => {
		if (reconnectAttempts < 5) { // Limit reconnection attempts
			reconnectAttempts++;
			notification.show(`Connection lost. Attempting to reconnect (${reconnectAttempts}/5)...`, true);
			ws = new WebSocket("ws://localhost:1234/ws");
			setupWebSocketHandlers();
		} else {
			notification.show('Unable to connect to server. Please refresh the page or check if the server is running.', true);
			clearInterval(reconnectInterval);
		}
	};

	// Set up all WebSocket event handlers
	const setupWebSocketHandlers = () => {
		ws.onmessage = e => {
			// If we get a message, we're connected, so reset reconnect attempts
			reconnectAttempts = 0;
			notification.hide();

			// Intercept replies to pasted-image saves; they don't reset the canvas
			let _early;
			try { _early = JSON.parse(e.data); } catch (_) {}
			if (_early && _early.type === "image_saved") {
				handlePastedImageSaved(_early);
				return;
			}

		resetCanvas();
		const {files, layout, path, theme} = JSON.parse(e.data);
		
		// Create title
		const p = document.createElement("p");
		p.setAttribute("id", "path");
		p.innerHTML = `CS_Store > ${path}`;
		p.style.zIndex = 5;
		p.classList.add("textNode");
		p.contentEditable = "true";
		p.onclick = () => {
			p.focus();
			p.innerHTML = path;
			const range = document.createRange();
			range.selectNodeContents(p);
			const sel = window.getSelection();
			sel.removeAllRanges();
			sel.addRange(range);
		}
		p.onkeypress = (e) => {
			if (e.key === "Enter") {
				p.blur();
				ws.send(JSON.stringify({
					"type": "cd",
					"path": p.innerHTML,
				}));
			}
		}
		document.body.appendChild(p);

		// Set the theme
		if (theme) {
			currentThemeIndex = themes.indexOf(theme);
			if (currentThemeIndex === -1) currentThemeIndex = 0;  // fallback to first theme if not found
			document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
			updateNodeStyles();
			updateFavicon();
		}
		
		// Populate stage with listing
		files.map(d => {
			stage.addNode(new Node({
				data: d,
				render: { x: 0, y: 0, z: 4, },
			}));
		})
		
		// Populate scene with layout
		if (Object.keys(layout).length > 0) {
			scene.origin = new Vec({
				x: layout.x,
				y: layout.y,
			});
			scene.scale = layout.scale;
			for (const child of layout.children) {
				const node = new Node(child);
				scene.addNode(node);
				node.triggerAutoplay();
			}
			scene.render();
		}
		
		lastSavedLayout = layout;
	};
	}
	
	ws.onopen = e => {
		// Reset reconnection attempts and clear any error notifications
		reconnectAttempts = 0;
		notification.hide();
		
		if (reconnectInterval) {
			clearInterval(reconnectInterval);
			reconnectInterval = null;
			notification.show("Connection to server restored!", false);
		}
		
		ws.send(JSON.stringify({"type": "initialize"}));
		
		const autosave = () => {
			const currentLayout = scene.serialize();
			if (JSON.stringify(currentLayout) !== JSON.stringify(lastSavedLayout)) {
				console.log("Saving new layout...");
				ws.send(JSON.stringify({
					"type": "layout",
					"layout": currentLayout,
				}));
				lastSavedLayout = currentLayout;
			}
			setTimeout(autosave, 1000);
		}
		setTimeout(autosave, 1000);
	};
	
	ws.onclose = e => {
		console.log("WebSocket connection closed", e);
		
		// Only show notification if it wasn't a normal closure
		if (!e.wasClean) {
			notification.show("Connection to server lost. Attempting to reconnect...", true);
			
			// Set up reconnection interval if not already active
			if (!reconnectInterval) {
				reconnectInterval = setInterval(attemptReconnect, 5000);
			}
		}
	};
	
	ws.onerror = e => {
		console.error("WebSocket error:", e);
		notification.show("Connection error. Attempting to reconnect...", true);
		
		// Set up reconnection interval if not already active
		if (!reconnectInterval) {
			reconnectInterval = setInterval(attemptReconnect, 5000);
		}
	};
	
	// Initial setup of handlers
	setupWebSocketHandlers();

	// Track cursor so paste events can be positioned under it
	let lastMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
	document.addEventListener("mousemove", (e) => {
		lastMouse.x = e.clientX;
		lastMouse.y = e.clientY;
	});

	// Pending paste requests waiting for server confirmation
	const pendingPastes = {};

	function handlePastedImageSaved(parsed) {
		const pending = pendingPastes[parsed.requestId];
		if (!pending) return;
		delete pendingPastes[parsed.requestId];

		const mime = parsed.mime || "image/png";
		const probe = new Image();
		probe.onload = () => {
			const ratio = probe.width / probe.height;
			const targetPx = 400;
			const w = (ratio >= 1 ? targetPx : targetPx * ratio) / pending.creationScale;
			const h = w / ratio;
			// Center the new node on the cursor position
			const node = new Node({
				data: { type: mime, path: parsed.path },
				render: {
					x: pending.x - w / 2,
					y: pending.y - h / 2,
					z: 4,
					w: w,
					h: h,
					creationScale: pending.creationScale,
				},
			});
			scene.addNode(node);

			stage.addNode(new Node({
				data: { type: mime, path: parsed.path },
				render: { x: 0, y: 0, z: 4 },
			}));
		};
		probe.src = parsed.path;
	}

	// Listen for image data on the clipboard
	document.addEventListener("paste", (e) => {
		if (!e.clipboardData) return;
		const items = e.clipboardData.items;
		if (!items) return;

		for (const item of items) {
			if (item.kind !== "file" || !item.type.startsWith("image/")) continue;

			const file = item.getAsFile();
			if (!file) continue;

			e.preventDefault();

			const reader = new FileReader();
			reader.onload = () => {
				const result = reader.result;
				const comma = result.indexOf(",");
				const b64 = comma >= 0 ? result.slice(comma + 1) : result;

				const requestId = `paste_${Date.now()}_${Math.random().toString(36).slice(2)}`;
				const absPos = scene.toAbsolute(new Vec({ x: lastMouse.x, y: lastMouse.y }));

				pendingPastes[requestId] = {
					x: absPos.x,
					y: absPos.y,
					creationScale: scene.scale,
				};

				ws.send(JSON.stringify({
					type: "save_image",
					mime: item.type,
					data: b64,
					requestId: requestId,
				}));
			};
			reader.readAsDataURL(file);
			break;
		}
	});

	function updateAllAudioSpatialization() {
		scene.children.forEach(node => {
			node.updateAudioSpatialization();
		});
		requestAnimationFrame(updateAllAudioSpatialization);
	}

	updateAllAudioSpatialization();
</script>
